<!doctype html>
<html>

  <head>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.4/full/pyodide.js"></script>
  </head>

  <body>
    <p>
      You can execute any Python code. Just enter something in the box below and
      click the button.
    </p>
    <input id="code" style="width: 90%;" value="" />
    <button onclick="evaluatePython()">Run</button>
    <br />
    <br />
    <div>Output:</div>
    <textarea id="output" style="width: 100%;" rows="6" disabled></textarea>


    <script>
      const output = document.getElementById("output");
      const code = document.getElementById("code");

      function addToOutput(s) {
        output.value += ">>> " + code.value + "\n" + s + "\n";
      }

      output.value = "Initializing...\n";
      // init Pyodide
      async function main() {
        let pyodide = await loadPyodide();
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");
        await micropip.install("https://files.pythonhosted.org/packages/e0/d0/3f70a57cb8ea1e522d4134f392768b2c70caf15169eaee6d7c6d8497d3f9/pynapple-0.9.2-py3-none-any.whl");

        pyodide.runPython(`
            import numpy as np
            import pynapple as nap
            `);
        output.value += "Ready!\n";
        return pyodide;
      }
      let pyodideReadyPromise = main();

      async function evaluatePython() {
        let pyodide = await pyodideReadyPromise;
        try {
          let out = pyodide.runPython(code.value);
          addToOutput(out);
        } catch (err) {
          addToOutput(err);
        }
      }
    </script>
  </body>
</html>
