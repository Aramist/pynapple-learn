<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="code_style.css" type="text/css" />
        <script src="https://cdn.jsdelivr.net/pyodide/v0.27.4/full/pyodide.js"></script>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/default.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/python.min.js"></script>
    </head>

    <body>
        <p>
            You can write and execute Python code in the REPL. Just enter
            something in the box below and click "Run" or press &#x21E7 + &#x23CE.
            You can also access past commands using the up and down arrow keys.
        </p>
        <br />
        <br />
        <div>Output:</div>
        <div id="output-box" style="height: 300px; width: 100%; overflow: scroll"></div>
        <div>
            <textarea id="code" style="width: 85%" rows="3"></textarea>
            <button onclick="evaluatePython()">Run (&#x21E7+&#x23CE)</button>
        </div>
        

        <script src="script.js"></script>
    </body>
</html>
